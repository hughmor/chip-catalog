<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chip</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="viewer">
<aside id="panel">
  <a href="/">&larr; Catalog</a>
  <div class="titlebar"><h1 id="name"></h1><button onclick="toggleTheme()" title="Light or dark mode">◐</button><button id="edit" title="Make the chip record and die status editable">Edit</button></div>
  <nav class="tabs">
    <button data-tab="info" class="on">Info</button>
    <button data-tab="cells">Cells</button>
    <button data-tab="wafers">Wafers</button>
  </nav>

  <section id="tab-info">
    <dl id="infoview"></dl>
    <form id="info" class="hidden">
      <div class="fields"></div>
      <p><button type="submit">Save</button> <button type="button" id="cancel">Cancel</button><span class="msg" id="savemsg"></span></p>
    </form>
  </section>

  <section id="tab-cells" class="hidden">
    <div class="row"><input id="cellq" type="search" placeholder="Search all cells"></div>
    <div id="celltree"></div>
  </section>

  <section id="tab-wafers" class="hidden">
    <p id="nowafers" class="msg">This chip has no wafers. Add one in the Info tab.</p>
    <div id="waferui">
      <div class="row">
        <select id="wafer"></select>
        <button data-mode="map" class="on">Map</button><button data-mode="table">Table</button>
      </div>
      <div id="legend"></div>
      <p id="readhint" class="msg">Click Edit to change die status and notes.</p>
      <div id="wafermap"></div>
      <table id="dietable" class="hidden"><thead><tr><th>Die</th><th>Status</th><th>Notes</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</aside>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="toolbar"><button id="fit">Fit</button><button id="clear">Clear highlight</button><span id="hlinfo" class="hidden"></span><span id="coords"></span></div>
</div>
<script src="shared.js"></script>
<script src="chip.js"></script>
</body>
</html>
