<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chip</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
<aside id="panel">
  <a href="/">&larr; Catalog</a>
  <div class="titlebar"><h1 id="name"></h1><button id="edit" title="Make the chip record and die status editable">Edit</button></div>
  <nav class="tabs">
    <button data-tab="info" class="on">Info</button>
    <button data-tab="cells">Cells</button>
    <button data-tab="wafers">Wafers</button>
  </nav>

  <section id="tab-info">
    <dl id="infoview"></dl>
    <form id="info" class="hidden">
      <label class="f">Internal name <input name="internal_name"></label>
      <label class="f">Official (foundry / MPW) designation <input name="designation"></label>
      <label class="f">Foundry / technology <input name="technology" list="techs"><span id="lyp"></span></label>
      <datalist id="techs"></datalist>
      <label class="f">Run (month / year) <input name="run" type="month" placeholder="YYYY-MM" pattern="\d{4}-\d{2}"></label>
      <label class="f">GitHub repository <input name="github" type="url" placeholder="https://github.com/..."></label>
      <div class="f">Authors</div>
      <div id="authors-edit"></div>
      <div class="row"><button type="button" id="addauthor" title="Add an author">+</button></div>
      <label class="f">Notes <textarea name="notes"></textarea></label>
      <div class="f">Wafers <small>(none for a one-off die)</small></div>
      <div id="wafers-edit"></div>
      <div class="row"><button type="button" id="addwafer">+ Add wafer</button></div>
      <p><button type="submit">Save</button> <button type="button" id="cancel">Cancel</button><span class="msg" id="savemsg"></span></p>
    </form>
  </section>

  <section id="tab-cells" class="hidden">
    <div class="row"><input id="cellq" type="search" placeholder="Search all cells"></div>
    <div id="celltree"></div>
  </section>

  <section id="tab-wafers" class="hidden">
    <p id="nowafers" class="msg">This chip has no wafers. Add one in the Info tab.</p>
    <div id="waferui">
      <div class="row">
        <select id="wafer"></select>
        <button data-mode="map" class="on">Map</button><button data-mode="table">Table</button>
      </div>
      <div id="legend"></div>
      <p id="readhint" class="msg">Click Edit to change die status and notes.</p>
      <div id="wafermap"></div>
      <table id="dietable" class="hidden"><thead><tr><th>Die</th><th>Status</th><th>Notes</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</aside>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="toolbar"><button id="fit">Fit</button><button id="clear">Clear highlight</button><span id="hlinfo" class="hidden"></span><span id="coords"></span></div>
</div>
<script src="chip.js"></script>
</body>
</html>
